<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f4ef">
  <title>Little Years</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/app.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="masthead">
    <a class="wordmark" href="/" aria-label="Little Years home"><span class="wordmark-mark">LY</span><span>little years</span></a>
    <p class="masthead-note">A family archive <span aria-hidden="true">/</span> made to wander</p>
    <div class="account-actions" id="account-actions"></div>
  </header>
  <main>
    <div class="timeline-progress" aria-hidden="true"><span id="progress-fill"></span></div>
    <section class="timeline" id="timeline" aria-label="Life timeline" tabindex="0">
      <div class="loading-state" id="loading-state"><span class="loading-mark">LY</span><p>Gathering the little years</p></div>
    </section>
    <nav class="timeline-index" id="timeline-index" aria-label="Jump to an era"></nav>
  </main>
  <dialog class="auth-dialog" id="auth-dialog">
    <button class="icon-button dialog-close" type="button" aria-label="Close">×</button>
    <p class="eyebrow">A note from the family</p>
    <h2>Come closer.</h2>
    <p class="dialog-copy">Sign in with a one-time link. No password to remember.</p>
    <form id="magic-form">
      <label for="magic-name">Your name</label>
      <input id="magic-name" name="name" autocomplete="name" required maxlength="120">
      <label for="magic-email">Email address</label>
      <input id="magic-email" name="email" type="email" autocomplete="email" required maxlength="254">
      <button class="button button-dark" type="submit">Send my sign-in link <span aria-hidden="true">↗</span></button>
      <p class="form-message" id="magic-message" aria-live="polite"></p>
    </form>
  </dialog>
  <dialog class="artifact-dialog" id="artifact-dialog" aria-labelledby="artifact-heading">
    <button class="icon-button artifact-close" type="button" aria-label="Close artifacts">×</button>
    <p class="eyebrow">Event library</p>
    <h2 id="artifact-heading">Artifacts</h2>
    <label for="artifact-event">Event</label>
    <select id="artifact-event"></select>
    <p class="artifact-status" id="artifact-status" aria-live="polite"></p>
    <div class="artifact-list" id="artifact-list"></div>
    <form class="artifact-upload" id="artifact-upload" hidden>
      <h3>Add artifact</h3>
      <label for="artifact-title">Title</label>
      <input id="artifact-title" name="title" maxlength="160" required>
      <label for="artifact-description">Description</label>
      <textarea id="artifact-description" name="description" maxlength="4000"></textarea>
      <label for="artifact-file">File</label>
      <input id="artifact-file" name="file" type="file" accept=".pdf,.png,.jpg,.jpeg,.webp,.txt" required>
      <button class="button button-dark" type="submit">Upload artifact</button>
    </form>
  </dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
